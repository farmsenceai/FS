<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>FarmSence Contact | Intelligent Poultry Farming</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/assets/css/style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/assets/css/contact-form-style.css">

<!-- Javascript -->
<script src="/assets/js/main.js" defer></script>

<!-- React -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="stylesheet" href="/assets/css/signal-split.css">
<script type="text/babel" src="/assets/js/signal-split.js" defer></script>

</head>

<body class="page-with-fixed-header">

<!-- PAGE HEADER -->
<header class="site-header scroll-header">
  <div id="header-placeholder"></div>
</header>

<!-- CONTACT SECTION -->
<section class="contact-section">
  <div class="container-main">
    <div class="contact-container">

      <!-- LEFT: Info -->
      <div class="contact-left">
        <h2>Contact Us</h2>
        <p>
          Have questions about FarmSence or want to explore how our AI systems
          can improve your livestock operations? Send us a message and our team
          will get back to you shortly.
        </p>
        <div class="contact-info">
          <p><strong>Email</strong><br><a style="text-decoration:none;" href="mailto:get@farmsence.ai">get@farmsence.ai</a></p>
          <p><strong>Phone</strong><br><a style="text-decoration:none;" href="tel:+919939309699">+91 9939 209 699</a></p>
          <p><strong>Location</strong><br>India</p>
        </div>
      </div>

      <!-- RIGHT: Form -->
      <div class="contact-right">
        <h2>Connect with us here!</h2>
        <br>
        <form class="contact-form" id="contactForm">

          <div class="form-row">
            <input type="text" id="name" placeholder="Full Name" required>
            <input type="email" id="email" placeholder="Email Address" required>
          </div>

          <div class="form-row">
            <input type="tel" id="phone" placeholder="Phone Number">
            <input type="text" id="farmSize" placeholder="Farm Size in SQFT only">
          </div>

          <div class="form-group full-width">
            <select id="partnership" class="custom-select" required>
              <option value="">Select Partnership Type</option>
              <option value="consulting">Consulting, Training &amp; Sales</option>
              <option value="franchise">Franchise Farming</option>
              <option value="contract">Contract Farming</option>
              <option value="investment">Investment Partnership</option>
            </select>
          </div>

          <textarea id="message" placeholder="Your Message"></textarea>

          <button type="submit">Send Message</button>

        </form>
      </div><!-- end contact-right -->

    </div><!-- end contact-container -->
  </div><!-- end container-main -->
</section>

<div id="footer-placeholder"></div>
<script src="/assets/js/layout-loader.js"></script>
<script src="/assets/js/contact-form.js"></script>

</body>
</html>
