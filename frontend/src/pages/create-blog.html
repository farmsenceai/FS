<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Blog Article | FarmSence AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Core layout styles -->
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Editor custom styling -->
  <link rel="stylesheet" href="assets/css/blog-editor.css">

  <!-- Javascript -->
  <script src="/assets/js/main.js" defer></script>
  <script src="/assets/js/layout-loader.js"></script>
</head>
<body class="page-with-fixed-header create-blog-page">

  <!-- PAGE HEADER -->
  <header class="site-header scroll-header">
    <div id="header-placeholder"></div>
  </header>

  <!-- BLOCK EDITOR FORM -->
  <main class="editor-container">
    <div class="editor-card">
      <h1 style="font-size: 24px; font-weight: 700; margin-bottom: 24px; color: #111827;">Create Blog Post</h1>
      
      <!-- Blog Title -->
      <input type="text" id="blog-title" class="editor-title-input" placeholder="Enter blog title..." required>

      <!-- Cover Image Selection (Mandatory) -->
      <div class="cover-image-section">
        <span class="cover-image-label">Cover Image *</span>
        <div id="cover-upload-area" class="cover-image-upload">
          <i class="fa-solid fa-cloud-arrow-up" style="font-size: 32px; color: #9ca3af; margin-bottom: 10px;"></i>
          <p style="margin: 0; font-size: 13px; color: #6b7280;">Use a Cover Image URL or upload from your device</p>
          <div class="cover-source-tabs" role="group" aria-label="Cover image source">
            <button type="button" class="cover-source-tab active" data-cover-source="url">URL</button>
            <button type="button" class="cover-source-tab" data-cover-source="upload">Upload</button>
          </div>
          <div class="cover-source-panel" id="cover-url-panel">
            <input type="text" id="cover-image-url" class="block-input-text" placeholder="https://example.com/image.jpg">
          </div>
          <div class="cover-source-panel cover-source-panel-hidden" id="cover-upload-panel">
            <input type="file" id="cover-image-file" accept="image/*" class="cover-file-input">
            <button type="button" class="cover-upload-btn" id="cover-image-file-btn">
              <i class="fa-solid fa-upload"></i> Choose Image
            </button>
            <span id="cover-upload-status" class="cover-upload-status"></span>
          </div>
        </div>
        <img id="cover-preview" class="cover-image-preview" alt="Cover Image Preview">
      </div>

      <div style="font-weight: 600; font-size: 14px; color: #4b5563; margin-bottom: 12px;">Blog Content</div>
      <div class="notepad-toolbar" aria-label="Formatting toolbar">
        <button type="button" class="format-btn" data-command="formatBlock" data-value="H2" title="Heading"><i class="fa-solid fa-heading"></i></button>
        <button type="button" class="format-btn" data-command="bold" title="Bold"><i class="fa-solid fa-bold"></i></button>
        <button type="button" class="format-btn" data-command="italic" title="Italic"><i class="fa-solid fa-italic"></i></button>
        <button type="button" class="format-btn" data-command="underline" title="Underline"><i class="fa-solid fa-underline"></i></button>
        <button type="button" class="format-btn" data-command="strikeThrough" title="Strikethrough"><i class="fa-solid fa-strikethrough"></i></button>
        <button type="button" class="format-btn" data-command="insertUnorderedList" title="Bulleted list"><i class="fa-solid fa-list-ul"></i></button>
        <button type="button" class="format-btn" data-command="insertOrderedList" title="Numbered list"><i class="fa-solid fa-list-ol"></i></button>
        <button type="button" class="format-btn" data-command="createLink" title="Link"><i class="fa-solid fa-link"></i></button>
      </div>
      <div id="notepad-editor" class="notepad-editor" contenteditable="true" aria-label="Blog article body"></div>
      
      <!-- Ordered Blocks List -->
      <div id="blocks-list" class="blocks-list">
        <!-- Dynamically injected blocks go here -->
      </div>

      <!-- Add Content Block Controls -->
      <div class="add-block-menu">
        <button type="button" class="add-block-btn" data-type="image"><i class="fa-solid fa-image"></i> Image</button>
        <button type="button" class="add-block-btn" data-type="quote"><i class="fa-solid fa-quote-left"></i> Quote</button>
      </div>

      <!-- Form Actions -->
      <div class="editor-actions">
        <button type="button" class="editor-btn btn-secondary" id="action-save-draft">Save Draft</button>
        <button type="button" class="editor-btn btn-preview" id="action-preview">Preview Block</button>
        <button type="button" class="editor-btn btn-primary" id="action-submit">Submit for Review</button>
      </div>
    </div>
  </main>

  <!-- PREVIEW MODAL -->
  <div id="preview-modal" class="preview-modal">
    <div class="preview-content-card">
      <span class="preview-close" id="close-preview-modal">&times;</span>
      <div id="preview-modal-body">
        <!-- Rendered preview of blog blocks -->
      </div>
    </div>
  </div>

  <!-- SUCCESS TOAST -->
  <div id="success-toast" class="toast">
    <div style="display: flex; align-items: center; gap: 8px;">
      <i class="fa-solid fa-circle-check" style="font-size: 18px;"></i>
      <div>
        <div style="font-weight: 700;">Blog submitted!</div>
        <div id="toast-timestamp" style="font-size: 11px; opacity: 0.9;">Date/Time</div>
      </div>
    </div>
  </div>

  <!-- COVER CROP MODAL -->
  <div id="cover-crop-modal" class="preview-modal">
    <div class="preview-content-card crop-content-card">
      <span class="preview-close" id="close-cover-crop">&times;</span>
      <h2 class="crop-title">Crop Cover Image</h2>
      <div class="crop-frame">
        <img id="cover-crop-image" alt="Crop cover preview">
      </div>
      <div class="crop-actions">
        <button type="button" class="editor-btn btn-secondary" id="cancel-cover-crop">Cancel</button>
        <button type="button" class="editor-btn btn-primary" id="apply-cover-crop">Use Cover</button>
      </div>
    </div>
  </div>

  <!-- PAGE FOOTER -->
  <div id="footer-placeholder"></div>

  <!-- Block Editor Logic Scripts -->
  <script src="assets/js/create-blog.js"></script>

</body>
</html>
