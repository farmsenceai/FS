<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — FarmSence.ai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/css/sign-in.css">
  <link rel="stylesheet" href="assets/css/sign-in-inline.css">
</head>
<body class="page-with-fixed-header">

  <!-- PAGE HEADER -->
  <header class="site-header scroll-header">
    <div id="header-placeholder"></div>
  </header>

  <!-- Centred content -->
  <main class="si-main">

    <!-- STEP 1: Role selection -->
    <div class="si-card" id="role-select-card">
      <div class="si-card-top">
        <h1 class="si-title">Welcome to FarmSence</h1>
        <p class="si-sub">Select your role to continue</p>
      </div>

      <div class="fs-role-group" id="fs-role-group">
        <label class="fs-role-option" data-role="business">
          <input type="radio" name="fs-role" value="business" class="fs-role-radio">
          <span class="fs-role-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="3" y="8" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.6"/>
              <path d="M8 8V6a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" stroke="currentColor" stroke-width="1.6"/>
              <path d="M3 13h18" stroke="currentColor" stroke-width="1.6"/>
            </svg>
          </span>
          <span class="fs-role-label">Business</span>
        </label>

        <label class="fs-role-option" data-role="farmer">
          <input type="radio" name="fs-role" value="farmer" class="fs-role-radio">
          <span class="fs-role-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 21c0-6 4-8 4-13a4 4 0 0 0-8 0c0 5 4 7 4 13z" stroke="currentColor" stroke-width="1.6"/>
              <path d="M12 13c0-3-2.5-4-2.5-7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="fs-role-label">Farmer</span>
        </label>

        <label class="fs-role-option" data-role="admin">
          <input type="radio" name="fs-role" value="admin" class="fs-role-radio">
          <span class="fs-role-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 3l7 3v5c0 5-3.2 8.5-7 10-3.8-1.5-7-5-7-10V6l7-3z" stroke="currentColor" stroke-width="1.6"/>
              <path d="M9.5 12l2 2 3.5-3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <span class="fs-role-label">Administrator</span>
        </label>
      </div>

      <button class="si-btn-primary fs-next-btn" id="fs-role-next" disabled>Next</button>
    </div>

    <!-- STEP 2: Two-column layout — role content (left) + sign-in card (right, unchanged) -->
    <div id="fs-two-col">

      <div class="fs-left-col" id="fs-left-col">
        <h1 class="fs-left-title" id="fs-left-title"></h1>
        <p class="fs-left-desc" id="fs-left-desc"></p>
        <div class="fs-left-features" id="fs-left-features"></div>
      </div>

      <div class="fs-right-col">
        <div class="si-card" id="sign-in-card">

          <div class="si-card-top">
            <h1 class="si-title">Welcome back</h1>
            <p class="si-sub">Sign in to your FarmSence account</p>
          </div>

          <!-- Email + Continue -->
          <div class="si-form-group">
            <input
              type="email"
              id="si-email"
              class="si-input"
              placeholder="Email address"
              autocomplete="email"
            >
            <input
              type="password"
              id="si-password"
              class="si-input"
              placeholder="Password"
              autocomplete="current-password"
            >
            <div class="fs-auth-message" id="si-auth-message" aria-live="polite"></div>
            <button class="si-btn-primary" id="si-continue">Sign in</button>
          </div>

          <!-- Divider -->
          <div class="si-divider">
            <span class="si-divider-line"></span>
            <span class="si-divider-text">or</span>
            <span class="si-divider-line"></span>
          </div>

          <!-- Social options -->
          <div class="si-social-group">

            <button class="si-btn-social" id="btn-google">
              <svg class="si-social-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
              </svg>
              Continue with Google
            </button>

            <button class="si-btn-social" id="btn-apple">
              <i class="fa-brands fa-apple si-social-icon-fa"></i>
              Continue with Apple
            </button>

            <button class="si-btn-social" id="btn-microsoft">
              <svg class="si-social-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path fill="#F35325" d="M1 1h10v10H1z"/>
                <path fill="#81BC06" d="M13 1h10v10H13z"/>
                <path fill="#05A6F0" d="M1 13h10v10H1z"/>
                <path fill="#FFBA08" d="M13 13h10v10H13z"/>
              </svg>
              Continue with Microsoft
            </button>

            <button class="si-btn-social" id="btn-phone">
              <i class="fa-solid fa-phone si-social-icon-fa"></i>
              Continue with phone
            </button>

          </div>

          <!-- Footer links -->
          <p class="si-signup-text">
            <span id="si-mode-text">Don't have an account?</span> <a href="#" class="si-link" id="si-toggle-mode">Sign up</a>
          </p>

        </div>
      </div>

    </div>
  </main>

  <!-- Bottom legal -->
  <footer class="si-footer">
    <a href="#" class="si-footer-link">Terms of Use</a>
    <span class="si-footer-sep">|</span>
    <a href="/src/pages/privacy-policy.html" class="si-footer-link">Privacy Policy</a>
  </footer>

  <script src="/assets/js/dashboard-route.js"></script>
<script src="assets/js/sign-in.js"></script>
  <script src="/assets/js/layout-loader.js"></script>
</body>
</html>
